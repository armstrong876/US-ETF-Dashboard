name: Holdings Refresh (1st & 16th) — Holdings + Key Fundamentals

# TWICE A MONTH (1st and 16th): two refreshes, both from GitHub's servers, both
# published to Supabase — no git commit, no Netlify deploy.
#   1. Key Fundamentals (AUM, expense ratio, P/E, yield, inception) from yfinance
#      -> yf_profiles.json (private bucket); data_engine.py merges it into
#      dashboard.json on the daily run, feeding the "Key Fundamentals" section.
#   2. Holdings of all 80 universe ETFs from the FUND COMPANIES' OWN FILES
#      (holdings_engine.py + holdings_sources.py): full holdings list, sector /
#      country / market-cap split worked out from those holdings.
#      (Replaces the etfdb scraper — etfdb blocks GitHub since Sep 2026.
#       The old etf_details_engine.py is kept in the repo only as a backup.)
#
# WHERE THE DATA LANDS (single source of truth = Supabase, never the repo):
#   site-data/details/{SYMBOL}.json         what the ETF page reads
#   site-data/holdings/{SYMBOL}.json        every holding (for the Portfolio Builder)
#   ETF Data/composition/{SYMBOL}.parquet   dated history, every row tagged with its source
#   ETF Data/nav/etf_derived.json           holdings count + top-10 % for the daily dashboard
#   ETF Data/holdings/stock_cache.json      per-stock sector/country, reused next run
#
# SOURCES (official only): iShares, State Street, VanEck, Global X, First Trust,
# Vanguard files; SEC Form N-PORT filing where a company blocks downloads
# (Invesco) or publishes none; Yahoo for FNGS (an ETN) and per-stock market cap.
#
# FAILURE = VISIBLE: if any fund cannot be downloaded, fails a check (stale date,
# weights not ~100 %, < 85 % classified, holdings count collapsed) or had to fall
# back to the SEC filing, that fund's previous file stays live and THIS RUN ENDS
# FAILED with the reason in the log's summary block.

on:
  schedule:
    - cron: '30 2 1,16 * *'   # 1st and 16th of every month, 08:00 AM IST (2:30 AM UTC)
  workflow_dispatch:            # Allows a manual run any time from the GitHub UI

# Supabase credentials (encrypted repo secrets) — available to every step.
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
  SUPABASE_SITE_BUCKET: ${{ secrets.SUPABASE_SITE_BUCKET }}

jobs:
  etf-details:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pandas + pyarrow: Parquet history. openpyxl: State Street / VanEck Excel.
          # lxml: First Trust page tables.
          pip install requests beautifulsoup4 yfinance pandas pyarrow openpyxl lxml

      # ORDER IS DELIBERATE — fundamentals FIRST.
      # holdings_engine.py reads yf_profiles.json and writes those values into
      # each ETF's Parquet snapshot. If it ran first it would stamp the previous
      # fundamentals with this snapshot's date.
      - name: 1/2  Refresh Key Fundamentals (yfinance) -> yf_profiles.json -> Supabase
        run: python update_fundamentals.py

      - name: 2/2  Holdings of all 80 ETFs (fund-company files) -> JSON + Parquet -> Supabase
        env:
          PUSH: '1'            # upload site JSON, full holdings, Parquet history, stock cache
        run: python holdings_engine.py --all

      - name: Done
        run: echo "Holdings + key fundamentals published to Supabase. No git commit / no Netlify deploy."
